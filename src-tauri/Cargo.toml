[package]
name = "comandos-claude-cleaner"
version = "0.1.0"
description = "COMANDOS Claude Cleaner — безопасная очистка следов Claude Desktop и Claude Code"
authors = ["COMANDOS Club"]
edition = "2021"

[lib]
name = "comandos_claude_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
walkdir = "2"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
