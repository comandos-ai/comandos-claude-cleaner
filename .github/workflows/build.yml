name: Build COMANDOS Claude Cleaner

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact_name: COMANDOS-Claude-Cleaner-macOS-universal
            args: "--target universal-apple-darwin"
            bundle_glob: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: windows-latest
            artifact_name: COMANDOS-Claude-Cleaner-Windows-x64
            args: ""
            bundle_glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri bundle and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "COMANDOS Claude Cleaner v__VERSION__"
          releaseBody: |
            ## Скачать COMANDOS Claude Cleaner v__VERSION__

            | Платформа | Файл установщика | Описание |
            |-----------|------------------|----------|
            | **macOS** (Apple Silicon + Intel) | `COMANDOS.Claude.Cleaner___VERSION___universal.dmg` | Универсальный образ `.dmg` для M1–M4 и Intel |
            | **Windows 10/11** (x64) | `COMANDOS.Claude.Cleaner___VERSION___x64-setup.exe` | Установщик NSIS (`.exe`) |
            | **Windows 10/11** (MSI) | `COMANDOS.Claude.Cleaner___VERSION___x64_en-US.msi` | Пакет Windows Installer (`.msi`) |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: warn
